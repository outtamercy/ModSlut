# ModSlut built-in name identities.
#
# These are aliases, not placement rules. They let a renamed fix/find its
# actual parent so the normal family pass can keep it in the same section and
# order it after that parent. Profile-specific additions belong in
# profiles/<active profile>/keywords.ini beside ModSlut's other profile data.

[strip]
noise = se, sse, ae, vr, edition, special

[alias]
Static Mesh Improvement Mod = SMIM
# Worldspace packs and resource APIs commonly use these short names in
# patches. They are identities only: their destination still comes from the
# active profile's roadmap and dependency graph.
Cities of the North = COTN
FileAccess Interface for Skyrim SE Scripts - FISSES = FISS, FISSES

[family]

[never]
