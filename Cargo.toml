[package]
name = "modslut"
version = "0.15.0"
edition = "2021"
description = "MO2 modlist organizer - sorts mods into separators, validates VR profile health"
authors = ["outtamercy"]
license = "GPL-3.0-only"
repository = "https://github.com/outtamercy/ModSlut"
homepage = "https://github.com/outtamercy/ModSlut"

[dependencies]
eframe = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
rayon = "1"
flate2 = "1"
# LOOT's own Rust sorting and metadata engine. MS keeps its left-pane
# roadmap logic; libloot supplies a second, authoritative plugin-order view
# while we compare both engines on real profiles before switching over.
libloot = "0.29.4"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
strip = true
