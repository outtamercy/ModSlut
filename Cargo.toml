[package]
name = "modslut"
version = "0.13.0"
edition = "2021"
description = "MO2 modlist organizer - sorts mods into separators, validates VR profile health"
authors = ["outtamercy"]
license = "GPL-3.0-only"
repository = "https://github.com/outtamercy/ModSlut"
homepage = "https://github.com/outtamercy/ModSlut"

[dependencies]
eframe = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
rayon = "1"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
strip = true
