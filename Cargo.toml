[package]
name = "modslut"
version = "0.1.0"
edition = "2021"
description = "MO2 modlist.txt organizer - sorts mods into separators via keyword rules"

[dependencies]
eframe = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
rayon = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
strip = true
